apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'sre-microservice'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['sre-service:80']

  alert_rules.yml: |
    groups:
      - name: sre_service_alerts
        rules:
          - alert: HighErrorRate
            expr: (sum(rate(http_requests_total{status_code=~"[45].."}[30s])) / sum(rate(http_requests_total[30s]))) > 0.05
            for: 5s
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate detected on sre-service"
              description: "Errors (4xx/5xx) exceed 5% of total traffic for >5s."

          - alert: HighLatencyP99
            expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[30s])) by (le)) > 0.05
            for: 5s
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency detected on sre-service"
              description: "p99 latency exceeds 50ms for >5s."
