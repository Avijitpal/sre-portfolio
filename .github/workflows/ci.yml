name: SRE Continuous Integration & Delivery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  app-test:
    name: Node.js Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite
        working-directory: ./week4-docker-containers/app
        run: npm test

  docker-security-scan:
    name: Docker Build & Trivy Scan
    needs: app-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t sre-service:${{ github.sha }} \
            -f week4-docker-containers/Dockerfile \
            week4-docker-containers

      - name: Run Trivy Vulnerability Scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            sre-service:${{ github.sha }}

  k8s-manifest-validation:
    name: Kubeconform Manifest Validation
    needs: app-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Run Kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -summary -strict week5-kubernetes/k8s/

  publish-image:
    name: Publish Container to GHCR
    needs: [docker-security-scan, k8s-manifest-validation]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Lowercase repo name to comply with OCI registry requirements
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/sre-service
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          docker build \
            -t $IMAGE_ID:${{ github.sha }} \
            -t $IMAGE_ID:latest \
            -f week4-docker-containers/Dockerfile \
            week4-docker-containers

          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
